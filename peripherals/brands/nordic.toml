# 佳点监控 · Nordic 通用引擎（nordic）外设协议（TOML，支持注释）
# 说明：VID 0x1915 是 Nordic 公版 2.4G 接收器，很多小众无线鼠标用它。32 字节，Report ID 0x05，发 [0x15,0x00,0x00,0x01]。
# 匹配/帧/校验规则改这里；界面点「刷新」会重新读取。

brand = "nordic"
name = "Nordic 通用引擎"
note = "VID 0x1915 是 Nordic 公版 2.4G 接收器，很多小众无线鼠标用它。32 字节，Report ID 0x05，发 [0x15,0x00,0x00,0x01]。"
default = "nordic32"

[protocols]
[protocols.nordic32]
desc = "32 字节 Feature/Output 查询，电量在 b[9]"
transport = "output"
note = "Nordic 公版接收器常见于各种小众无线鼠标，电量位置稳定在 b[9]。充电状态这条协议里没有，所以没写。"

[protocols.nordic32.match]
inputLength = 32

[protocols.nordic32.tx]
length = 32
reportId = "05"

[protocols.nordic32.tx.bytes]
"1" = "15"
"2" = "00"
"3" = "00"
"4" = "01"

[protocols.nordic32.tx.checksum]
put = 31
expr = "0"


[protocols.nordic32.rx]
length = 32
timeoutMs = 400
attempts = 3

[[protocols.nordic32.rx.match]]
offset = 0
equals = "05"


[protocols.nordic32.battery]
expr = "b[9]"
min = 1
max = 100

[protocols.nordic32.sample]
rx = "05 15 00 00 01 00 00 00 00 4b"

[protocols.nordic32.sample.expect]
battery = 75
