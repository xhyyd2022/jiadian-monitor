# 佳点监控 · CompX / OEM（compx）外设协议（TOML，支持注释）
# 说明：CompX 公版 VID 0x3554 等 OEM 设备。共享的 17 字节 MouseEnc 帧见 jm17；20 字节键盘见 keyboard20。VGN/ATK 品牌设备已拆到 vgn.json / atk.json。
# 匹配/帧/校验规则改这里；界面点「刷新」会重新读取。

brand = "compx"
name = "CompX / OEM"
note = "CompX 公版 VID 0x3554 等 OEM 设备。共享的 17 字节 MouseEnc 帧见 jm17；20 字节键盘见 keyboard20。VGN/ATK 品牌设备已拆到 vgn.json / atk.json。"
default = "jm17"

[protocols]
[protocols.mouse17]
desc = "17/17 字节鼠标端点：Cmd1 握手 → Cmd2 驱动激活 → Cmd3 在线 → Cmd4 读电量"
transport = "output"
note = "校验和 = 0x55 - (sum(b[1..15]) & 0xFF) 再取低 8 位。严禁用 inputLength >= 17 做匹配，否则会把 20 字节键盘端点一起吃进来。"

[protocols.mouse17.match]
usagePage = "FF02"
usage = "0002"
inputLength = 17
outputLength = 17

[[protocols.mouse17.tx]]
desc = "Cmd1 握手"
length = 17
reportId = "08"
delayMs = 20

[protocols.mouse17.tx.bytes]
"1" = "04"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "01"
"6" = "00"


[[protocols.mouse17.tx]]
desc = "Cmd2 驱动激活"
length = 17
reportId = "08"
delayMs = 20

[protocols.mouse17.tx.bytes]
"1" = "04"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "02"
"6" = "00"


[[protocols.mouse17.tx]]
desc = "Cmd3 在线查询"
length = 17
reportId = "08"
delayMs = 20

[protocols.mouse17.tx.bytes]
"1" = "04"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "03"
"6" = "00"


[[protocols.mouse17.tx]]
desc = "Cmd4 电量查询"
length = 17
reportId = "08"

[protocols.mouse17.tx.bytes]
"1" = "04"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "04"
"6" = "00"

[protocols.mouse17.tx.checksum]
put = 15
expr = "(0x55 - sum(1, 15)) & 0xff"


[protocols.mouse17.rx]
length = 17
timeoutMs = 400
attempts = 4
intervalMs = 30

[[protocols.mouse17.rx.match]]
offset = 1
equals = "04"


[protocols.mouse17.battery]
expr = "b[6]"
min = 1
max = 100

[[protocols.mouse17.fields]]
name = "charging"
expr = "b[7] == 1"
note = "b[7]==1 表示充电中"

[[protocols.mouse17.fields]]
name = "millivolts"
expr = "u16be(8)"
min = 0
max = 10000
note = "部分型号回包带电压高/低字节"

[protocols.mouse17.sample]
rx = "08 04 00 00 00 02 4b 00 0f 5c"

[protocols.mouse17.sample.expect]
battery = 75
charging = false
millivolts = 3932



[protocols.jm17]
desc = "VGN MouseEnc / Compx 共享 17 字节鼠标端点：Report 08，Cmd 0x04 读电量"
transport = "output"
note = "官方 VGN HUB 的 MouseEnc 族，也是 Compx/Pulsar/ATK/VXE 公版 17 字节帧：报告 ID 08 + 16 字节载荷，命令在 b[1]（0x04 电量），校验和 = (0x55 - sum(b[1..15]) - 8) & 0xFF。电量 b[6]、充电 b[7]、电压 u16be(8)。已在本机 VGN 蜻蜓3 MasterGT 实机验证。"

[protocols.jm17.match]
usagePage = "FF02"
usage = "0002"
inputLength = 17
outputLength = 17

[protocols.jm17.tx]
desc = "BatteryLevel 0x04"
length = 17
reportId = "08"

[protocols.jm17.tx.bytes]
"1" = "04"

[protocols.jm17.tx.checksum]
put = 16
expr = "(0x55 - sum(1, 15) - 8) & 0xff"


[protocols.jm17.rx]
length = 17
timeoutMs = 400
attempts = 4
intervalMs = 30

[[protocols.jm17.rx.match]]
offset = 0
equals = "08"

[[protocols.jm17.rx.match]]
offset = 1
equals = "04"


[protocols.jm17.battery]
expr = "b[6]"
min = 0
max = 100
valid = "b[16] == ((0x55 - sum(1, 15) - 8) & 0xff)"

[[protocols.jm17.fields]]
name = "charging"
expr = "b[7] == 1"
note = "b[7]==1 表示充电中"

[[protocols.jm17.fields]]
name = "millivolts"
expr = "u16be(8)"
min = 0
max = 10000
note = "b[8..9] 为电压高/低字节"

[protocols.jm17.sample]
rx = "08 04 00 00 00 02 55 00 0f cd 00 00 00 00 00 00 16"

[protocols.jm17.sample.expect]
battery = 85
charging = false
millivolts = 4045



[protocols.keyboard20]
desc = "20/20 字节键盘端点（MCHOSE G75 PRO 等）"
transport = "output"

[protocols.keyboard20.match]
usagePage = "FF02"
usage = "0002"
inputLength = 20
outputLength = 20

[protocols.keyboard20.tx]
length = 20
reportId = "13"

[protocols.keyboard20.tx.bytes]
"1" = "4a"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "00"
"6" = "00"

[protocols.keyboard20.tx.checksum]
put = 19
expr = "sum(0, 18) & 0xff"


[protocols.keyboard20.rx]
length = 20
timeoutMs = 400
attempts = 4
intervalMs = 30

[[protocols.keyboard20.rx.match]]
offset = 0
equals = "13"


[protocols.keyboard20.battery]
expr = "b[5]"
min = 1
max = 100

[[protocols.keyboard20.fields]]
name = "charging"
expr = "b[6] == 0x10"
note = "b[6]: 0x10 充电中、0x01 电池供电"

[protocols.keyboard20.sample]
rx = "13 4a 00 00 00 4b 10"

[protocols.keyboard20.sample.expect]
battery = 75
charging = true



[protocols.atk17]
desc = "ATK F1 Ultimate 2.0 / Beken 17 字节中断端点（无 Feature 端点，禁止 WriteFile 前 DrainReports）"
transport = "output"
note = "8K dongle 只暴露中断端点，FeatureReportByteLength == 0，所以 match.featureLength 写 0。写指令前不要清空输入队列，会丢掉紧随其后的回复。"

[protocols.atk17.match]
usagePage = "FF02"
usage = "0002"
inputLength = 17
outputLength = 17
featureLength = 0
productLike = "ATK"

[protocols.atk17.tx]
length = 17
reportId = "08"

[protocols.atk17.tx.bytes]
"1" = "04"
"2" = "00"
"3" = "00"
"4" = "00"
"5" = "00"
"6" = "00"

[protocols.atk17.tx.checksum]
put = 15
expr = "(0x55 - sum(1, 15)) & 0xff"


[protocols.atk17.rx]
length = 17
timeoutMs = 400
attempts = 4

[[protocols.atk17.rx.match]]
offset = 1
equals = "04"


[protocols.atk17.battery]
expr = "b[6]"
min = 1
max = 100

[[protocols.atk17.fields]]
name = "charging"
expr = "b[7] == 1"

[[protocols.atk17.fields]]
name = "millivolts"
expr = "u16be(8)"
min = 0
max = 10000

[protocols.atk17.sample]
rx = "08 04 00 00 00 02 4b 01 0f 5c"

[protocols.atk17.sample.expect]
battery = 75
charging = true



[protocols.atk64]
desc = "ATK / Beken 64 字节中断端点（VGN S99 等键盘）：Report 4 + 请求序号 + 0x1A"
transport = "output"
note = "实测 VGN S99（320F:5055，FF1C/0092，64/64 字节端点）直接响应 ATK V75X 的 0x1A 查询帧：回包 b[0]=Report ID 4、b[1..2] 原样回显请求序号、b[3]=0x1A、b[8]=电量百分比、b[9]=充电码。请求序号实测 0x0000 也能用，这里固定填 01。"

[protocols.atk64.match]
usagePage = "FF1C"
usage = "0092"
inputLength = 64
outputLength = 64
featureLength = 0

[protocols.atk64.tx]
length = 64
reportId = "04"
delayMs = 10

[protocols.atk64.tx.bytes]
"1" = "01"
"2" = "00"
"3" = "1a"


[protocols.atk64.rx]
length = 64
timeoutMs = 600
attempts = 4
intervalMs = 40

[[protocols.atk64.rx.match]]
offset = 0
equals = "04"

[[protocols.atk64.rx.match]]
offset = 3
equals = "1a"


[protocols.atk64.battery]
expr = "b[8]"
min = 0
max = 100

[[protocols.atk64.fields]]
name = "charging"
expr = "b[9] == 1"
note = "b[9]==1 充电中；b[9]==2 表示在线（有线/已充满）"

[protocols.atk64.sample]
rx = "04 01 00 1a 00 00 00 00 64 02 00"

[protocols.atk64.sample.expect]
battery = 100
charging = false
