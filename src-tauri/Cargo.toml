[package]
name = "jiaidian-monitor"
version = "0.6.0"
description = "把本机实时硬件数据（CPU / 内存 / 磁盘 / 网络 / GPU / 温度 / 风扇）通过 USB 推送到佳点（jiaidian）V1P / V2 小屏设备的 Windows 桌面监控程序"
authors = ["jiaidian-monitor contributors"]
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "jiaidian_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Usb", "Win32_Foundation", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console", "Win32_System_Memory", "Win32_System_Performance", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
ureq = { version = "3.4.2", features = ["json"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
png = "0.18.1"
base64 = "0.23.1"


[features]
# 生产构建：启用后 Tauri 用内嵌的 frontendDist（而非 devUrl 的 localhost）。
# 不加这个 feature，`cargo build` 会被判成 dev，窗口会去连 vite 开发服务器 → “localhost 拒绝连接”。
custom-protocol = ["tauri/custom-protocol"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
