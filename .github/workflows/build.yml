# ─────────────────────────────────────────────────────────────────────────────
#  构建 + 发版
#
#  触发方式：**仅手动**（Actions → build → Run workflow）
#    —— 不会在 push / pull_request 时自动编译。手动运行后编译并**创建一个 Release**。
#
#  发版前要改的两处（都由维护者手动编辑）
#    1) 版本号：package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml
#       —— 三处必须一致，不一致会在「校验版本号」步骤直接失败。
#       标签取 v<版本号>；若该标签已存在，会在发版前报错提醒你先把版本号改大。
#    2) 发版说明：.github/RELEASE_NOTES.md（本次 Release 的正文）
#       —— 正文末尾会自动附上「本次包含的提交」列表。
# ─────────────────────────────────────────────────────────────────────────────
name: build

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 标记为预发布（Pre-release）
        type: boolean
        default: false

permissions:
  contents: write # 创建 Release / 打标签

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows 构建
    runs-on: windows-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整历史来列「本次包含的提交」

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 Rust（MSVC）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 校验版本号三处一致
        shell: pwsh
        run: |
          $pkg   = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $conf  = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $m     = Select-String -Path src-tauri/Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $cargo = $m.Matches[0].Groups[1].Value
          Write-Host "package.json=$pkg  tauri.conf.json=$conf  Cargo.toml=$cargo"
          if ($pkg -ne $conf -or $pkg -ne $cargo) {
            throw "版本号不一致（package.json=$pkg / tauri.conf.json=$conf / Cargo.toml=$cargo），请先改成同一个版本号。"
          }
          "VERSION=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 安装前端依赖
        run: npm ci

      # `tauri build` 会先跑 package.json 的 beforeBuildCommand（vite build），
      # 再编译 Rust 并把前端产物内嵌进 exe。Tauri 2 已不需要 custom-protocol feature。
      # 只出 exe，不生成 NSIS/MSI 安装包；便携 zip 在下一步组装。
      - name: 构建（仅可执行文件）
        run: npm run tauri build -- --no-bundle

      - name: 组装便携包
        shell: pwsh
        run: |
          $rel = 'src-tauri/target/release'
          $out = 'portable'
          $zip = "jiaidian-monitor-v$env:VERSION.zip"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item "$rel/jiaidian-monitor.exe" $out -Force
          # 递归带上 assets（图标 + 主题）；没有 assets 目录时跳过
          if (Test-Path 'assets') { Copy-Item 'assets' $out -Recurse -Force }
          # 外设协议 JSON（index.json + brands/）：用户可直接编辑，必须随包发布
          if (Test-Path 'peripherals') {
            $periRoot = (Get-Item 'peripherals').FullName
            Get-ChildItem -Recurse -File 'peripherals' |
              Where-Object { -not $_.Name.StartsWith('_') } |
              ForEach-Object {
                $dst = Join-Path (Join-Path $out 'peripherals') $_.FullName.Substring($periRoot.Length).TrimStart('\', '/')
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $dst) | Out-Null
                Copy-Item $_.FullName $dst -Force
              }
          }
          # 可选：若仓库内提供了卸载辅助工具，则一并打包（与 exe 同级才能按 %~dp0 找到它）
          if (Test-Path 'scripts/uninstall-lhws.bat') { Copy-Item 'scripts/uninstall-lhws.bat' $out -Force }

          Compress-Archive -Path "$out/*" -DestinationPath $zip -Force
          Get-ChildItem $zip | Select-Object Name, Length

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: jiaidian-monitor-windows
          if-no-files-found: error
          path: |
            jiaidian-monitor-v*.zip

      # ── 发版步骤 ────────────────────────────────────────────────────────────

      - name: 检查版本标签是否已存在
        shell: pwsh
        run: |
          $tag = "v$env:VERSION"
          $hit = git ls-remote --tags origin "refs/tags/$tag"
          if ($hit) {
            throw "标签 $tag 已存在。请先把版本号改大（package.json / src-tauri/tauri.conf.json / src-tauri/Cargo.toml）再发版。"
          }
          Write-Host "标签 $tag 可用"

      - name: 组装 Release 正文
        shell: pwsh
        run: |
          # 让 PowerShell 按 UTF-8 解码 git 的输出，否则中文提交信息会变乱码
          [Console]::OutputEncoding = New-Object System.Text.UTF8Encoding($false)
          $OutputEncoding = New-Object System.Text.UTF8Encoding($false)

          $notes = ''
          if (Test-Path '.github/RELEASE_NOTES.md') {
            $notes = (Get-Content '.github/RELEASE_NOTES.md' -Raw).Trim()
          }

          # 上一个版本标签 → HEAD 之间的提交；没有标签就取最近 30 条
          $prev = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          if ($prev) {
            Write-Host "上一个版本标签：$prev"
            $commits = git log "$prev..HEAD" --pretty=format:'- %s (`%h`)'
          } else {
            Write-Host '没有历史标签，列出最近 30 条提交'
            $commits = git log -30 --pretty=format:'- %s (`%h`)'
          }
          if (-not $commits) { $commits = '- （无新提交）' }

          $parts = @()
          if ($notes) { $parts += $notes }
          $parts += ''
          $parts += '---'
          $parts += ''
          $parts += '### 本次包含的提交'
          $parts += ''
          $parts += $commits

          $path = Join-Path $PWD 'release-body.md'
          [System.IO.File]::WriteAllText($path, ($parts -join "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Release 正文已生成（$((Get-Item $path).Length) 字节）"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body_path: release-body.md
          prerelease: ${{ inputs.prerelease }}
          files: |
            jiaidian-monitor-v*.zip
